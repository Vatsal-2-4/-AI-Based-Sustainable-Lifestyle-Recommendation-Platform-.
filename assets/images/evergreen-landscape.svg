  <path d="M0 610 Q260 540 510 598 T1010 582 T1600 592 V1000 H0Z" fill="url(#meadow)"/>
  <path d="M0 652 Q230 590 420 638 T830 624 T1230 618 T1600 628 V720 Q1300 676 1060 717 T560 694 T0 735Z" fill="#b4c87b" opacity=".58"/>
  <path d="M0 718 Q250 674 475 720 T925 704 T1320 708 T1600 690 V1000 H0Z" fill="url(#foreground)"/>
  <path d="M0 760 Q210 735 410 770 T860 755 T1260 776 T1600 750" fill="none" stroke="#d9e797" stroke-opacity=".45" stroke-width="11"/>
  <path d="M0 820 Q260 785 510 830 T1010 810 T1600 825" fill="none" stroke="#a5c56a" stroke-opacity=".32" stroke-width="8"/>
  <!-- Distant hedgerow -->
  <g fill="#456347" opacity=".72">
