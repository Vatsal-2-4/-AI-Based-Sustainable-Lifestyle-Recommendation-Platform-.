<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#d8ff51" offset="0"/>
      <stop stop-color="#e6ffa0" offset=".26"/>
      <stop stop-color="#d8e8cf" offset=".54"/>
      <stop stop-color="#b8cfb0" offset=".72"/>
      <stop stop-color="#78966d" offset="1"/>
    </linearGradient>
    <linearGradient id="sunlit" x2="0" y2="1">
      <stop stop-color="#f7ffdb" stop-opacity=".88"/>
      <stop stop-color="#f4f6dc" stop-opacity=".2" offset="1"/>
    </linearGradient>
    <linearGradient id="meadow" x2="0" y2="1">
      <stop stop-color="#a2bd71"/>
      <stop stop-color="#557d3c" offset=".42"/>
      <stop stop-color="#193b26" offset="1"/>
    </linearGradient>
    <linearGradient id="foreground" x2="0" y2="1">
      <stop stop-color="#54753b"/>
      <stop stop-color="#173322" offset=".58"/>
      <stop stop-color="#0b2118" offset="1"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#fffbd5" stop-opacity=".94"/>
      <stop stop-color="#fffbd5" stop-opacity="0" offset="1"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <ellipse cx="800" cy="460" rx="610" ry="290" fill="url(#glow)"/>
  <g fill="#fff" opacity=".5" filter="url(#soft)">
    <ellipse cx="1160" cy="280" rx="200" ry="58"/>
