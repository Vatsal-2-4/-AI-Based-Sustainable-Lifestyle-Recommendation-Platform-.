    <circle cx="268" cy="587" r="30"/><circle cx="304" cy="572" r="42"/><circle cx="347" cy="592" r="25"/>
    <circle cx="1190" cy="590" r="26"/><circle cx="1230" cy="570" r="42"/><circle cx="1277" cy="591" r="29"/>
  </g>
  <!-- Soft right-side tree line -->
  <g fill="#385a3b" opacity=".86">
    <path d="M1330 660 Q1370 500 1410 650 Q1460 430 1510 660 Q1550 500 1600 655 V735 H1330Z"/>
    <path d="M1170 655 Q1200 535 1240 650 Q1280 490 1325 658 V710 H1170Z"/>
